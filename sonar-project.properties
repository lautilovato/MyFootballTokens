sonar.projectKey=lautilovato_MyFootballTokens
sonar.organization=lautilovato
sonar.javascript.lcov.reportPaths=back/coverage/lcov.info,front/coverage/lcov.info

# Código y tests conviven en las mismas carpetas: los tests se separan por nombre,
# así no cuentan como código sin cubrir.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*-spec.ts
sonar.test.exclusions=**/node_modules/**
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*-spec.ts

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=MyFootballTokens
#sonar.projectVersion=1.0

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
