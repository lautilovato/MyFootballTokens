sonar.projectKey=lautilovato_MyFootballTokens
sonar.organization=lautilovato
# Unitarios del back, e2e del back y front: Sonar suma la cobertura de los tres reportes.
sonar.javascript.lcov.reportPaths=back/coverage/lcov.info,back/coverage-e2e/lcov.info,front/coverage/lcov.info

# Código y tests conviven en las mismas carpetas: los tests se separan por nombre,
# así no cuentan como código sin cubrir.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*-spec.ts
sonar.test.exclusions=**/node_modules/**
sonar.exclusions=**/node_modules/**,**/coverage/**,**/coverage-e2e/**,**/dist/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*-spec.ts

# Fuera de la cobertura (se siguen analizando): las migraciones son SQL que corre la CLI de
# MikroORM, main.ts es el arranque del servidor (los e2e levantan la app sin pasar por él) y
# back/test/ son helpers de los tests e2e.
sonar.coverage.exclusions=**/migrations/**,back/src/main.ts,back/test/**

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=MyFootballTokens
#sonar.projectVersion=1.0

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
