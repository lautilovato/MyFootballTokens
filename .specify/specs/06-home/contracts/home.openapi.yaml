openapi: 3.0.3

info:
  title: Mercado de Jugadores de Fútbol — Home de Mercado
  description: >
    Contrato de la feature 06-home. Cubre el listado de jugadores enriquecido que alimenta la
    grilla de cartas, el detalle que alimenta el panel lateral, y el listado de ligas que puebla
    el panel de filtros.

    GET /players y GET /players/{id} ya existen desde la feature 01 y quedan protegidos desde la
    05: acá se amplían con nuevos parámetros de filtro y con los campos que la carta necesita.
    Los campos marcados como SIMULADO no provienen de ningún cálculo real: no existe todavía
    motor de cotizaciones y la spec los define como maqueta (FR-023). Su forma es definitiva;
    su origen cambiará cuando exista el motor.
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Desarrollo local

tags:
  - name: Players
    description: Catálogo de jugadores que alimenta la grilla y el panel de detalle
  - name: Leagues
    description: Ligas disponibles para el panel de filtros

security:
  - bearerAuth: []

paths:
  /players:
    get:
      tags: [Players]
      operationId: listPlayers
      summary: Listado paginado y filtrado de jugadores para la grilla del mercado
      description: >
        Todos los filtros son opcionales y se combinan con AND (FR-007). Los parámetros de
        valores múltiples se envían repitiendo la clave: `?league=Premier League&league=La Liga`.
      security:
        - bearerAuth: []
      parameters:
        - name: league
          in: query
          required: false
          description: Nombre de liga. Repetible (FR-001).
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
          example: ["Premier League", "La Liga"]
        - name: team
          in: query
          required: false
          description: Nombre de equipo. Repetible.
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: position
          in: query
          required: false
          description: Posición. Repetible (FR-002).
          schema:
            type: array
            items:
              type: string
              enum: [GK, DF, MF, FW, UNKNOWN]
          style: form
          explode: true
        - name: rarity
          in: query
          required: false
          description: Nivel de rareza. Repetible (FR-005). Se traduce a un rango de rating.
          schema:
            type: array
            items:
              type: string
              enum: [legendary, epic, rare, common]
          style: form
          explode: true
        - name: minValue
          in: query
          required: false
          description: Valor de mercado mínimo, inclusivo (FR-003).
          schema: { type: number, format: double, minimum: 0 }
        - name: maxValue
          in: query
          required: false
          description: Valor de mercado máximo, inclusivo (FR-003).
          schema: { type: number, format: double, minimum: 0 }
        - name: minOvr
          in: query
          required: false
          description: >
            OVR mínimo, inclusivo (FR-004). Excluye a los jugadores sin estadísticas de
            temporada, que no tienen OVR con el cual comparar (FR-030).
          schema: { type: integer, minimum: 0, maximum: 99 }
        - name: maxOvr
          in: query
          required: false
          description: OVR máximo, inclusivo (FR-004). Excluye a los jugadores sin estadísticas.
          schema: { type: integer, minimum: 0, maximum: 99 }
        - name: search
          in: query
          required: false
          description: >
            Fragmento del nombre. Coincidencia parcial, insensible a mayúsculas y a acentos
            (FR-006).
          schema: { type: string, minLength: 1, maxLength: 100 }
          example: "nicolas"
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Página de jugadores que satisfacen todos los filtros activos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayersPage' }
        '400':
          description: >
            Parámetro inválido: enum desconocido, rango invertido (mínimo mayor que máximo),
            número fuera de límites o parámetro no reconocido (FR-016).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '401':
          description: Sin credencial de sesión válida (FR-017)

  /players/{id}:
    get:
      tags: [Players]
      operationId: getPlayerDetail
      summary: Detalle de un jugador para el panel lateral
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detalle del jugador con el juego completo de métricas de temporada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerDetail' }
        '400':
          description: El identificador no tiene formato UUID válido
        '401':
          description: Sin credencial de sesión válida (FR-017)
        '404':
          description: No existe un jugador con ese identificador

  /leagues:
    get:
      tags: [Leagues]
      operationId: listLeagues
      summary: Ligas disponibles en el catálogo, para poblar el panel de filtros
      description: FR-011. Devuelve las ligas que efectivamente existen, no una lista fija.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ligas del catálogo, ordenadas por nombre
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/League' }
        '401':
          description: Sin credencial de sesión válida (FR-017)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Credencial de sesión emitida por POST /auth/login (feature 05). Esta feature no
        introduce ningún esquema de seguridad nuevo.

  schemas:
    Position:
      type: string
      enum: [GK, DF, MF, FW, UNKNOWN]

    Rarity:
      type: string
      enum: [legendary, epic, rare, common]
      description: >
        Derivada del OVR (FR-029): ≥85 legendary, 77–84 epic, 70–76 rare, <70 common. Un
        jugador sin estadísticas de temporada es common (FR-030).

    Club:
      type: object
      required: [name, crestUrl]
      properties:
        name: { type: string, example: "Manchester City" }
        crestUrl:
          type: string
          format: uri
          nullable: true
          description: Nulo mientras no se carguen los escudos; la carta dibuja iniciales.

    Nationality:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
          nullable: true
          example: "England"
        code:
          type: string
          nullable: true
          description: >
            ISO 3166-1 alpha-2 en minúscula, o subdivisión de flagcdn para las selecciones
            británicas (gb-eng, gb-sct, gb-wls, gb-nir). Nulo si el país no está mapeado; la
            carta omite la bandera (research #7).
          example: "gb-eng"

    Supply:
      type: object
      required: [minted, total]
      description: >
        SIMULADO. Constantes derivadas de la regla de dominio de la constitución §5: 100 tokens
        por jugador, concentrados inicialmente en un único superusuario. No hay entidad Token.
      properties:
        minted: { type: integer, example: 100 }
        total: { type: integer, example: 100 }

    PlayerCard:
      type: object
      required:
        [id, name, position, ovr, rarity, club, nationality, goals, assists,
         marketValue, changePct, supply, priceHistory]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Erling Haaland" }
        position: { $ref: '#/components/schemas/Position' }
        ovr:
          type: integer
          nullable: true
          minimum: 0
          maximum: 99
          description: >
            Parte entera y primer decimal del rating de temporada, como entero de dos cifras
            (FR-027): rating 8,63 → 86. Nulo si el jugador no tiene estadísticas (FR-030).
          example: 86
        rarity: { $ref: '#/components/schemas/Rarity' }
        club: { $ref: '#/components/schemas/Club' }
        nationality: { $ref: '#/components/schemas/Nationality' }
        goals:
          type: integer
          nullable: true
          description: Nulo —no cero— si el jugador no tiene estadísticas de temporada (FR-015).
        assists:
          type: integer
          nullable: true
        marketValue:
          type: number
          format: double
          description: Valor base del jugador. Dato real.
          example: 8450.00
        changePct:
          type: number
          format: double
          description: SIMULADO. Determinista por jugador (research #5).
          example: 12.5
        supply: { $ref: '#/components/schemas/Supply' }
        priceHistory:
          type: array
          description: >
            SIMULADO. 30 puntos, del más viejo al más nuevo, terminando en marketValue
            (research #5).
          items: { type: number, format: double }
          minItems: 30
          maxItems: 30

    PlayerDetail:
      allOf:
        - $ref: '#/components/schemas/PlayerCard'
        - type: object
          required: [league, season, height, shotsPerGame, keyPasses, dribbles, tackles, rating]
          properties:
            league: { type: string, example: "Premier League" }
            season:
              type: string
              nullable: true
              description: Temporada de las métricas devueltas. Nula si no tiene estadísticas.
              example: "2025-2026"
            height:
              type: integer
              nullable: true
              description: Centímetros. Atributo del jugador, no de la temporada.
              example: 195
            shotsPerGame: { type: number, format: double, nullable: true }
            keyPasses: { type: number, format: double, nullable: true }
            dribbles: { type: number, format: double, nullable: true }
            tackles: { type: number, format: double, nullable: true }
            rating:
              type: number
              format: double
              nullable: true
              description: Rating de temporada, origen del OVR.
              example: 8.63

    PageMeta:
      type: object
      required: [total, page, limit, totalPages]
      properties:
        total:
          type: integer
          description: Jugadores que satisfacen los filtros activos, no los de la página (FR-008).
        page: { type: integer }
        limit: { type: integer }
        totalPages: { type: integer }

    PlayersPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PlayerCard' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    League:
      type: object
      required: [id, name, country, code]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: "Premier League" }
        country: { type: string, example: "England" }
        code:
          type: string
          nullable: true
          example: "PL"

    ValidationError:
      type: object
      properties:
        statusCode: { type: integer, example: 400 }
        message:
          type: array
          items: { type: string }
          example: ["minOvr must not be greater than maxOvr"]
        error: { type: string, example: "Bad Request" }
